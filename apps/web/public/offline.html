<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#03050F">
  <title>Offline — ASCEND CA Community</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #03050F;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(80% 60% at 50% 20%, rgba(15, 56, 192, 0.35) 0%, transparent 70%);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(7, 13, 40, 0.95);
      border: 1px solid #1E2756;
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(184, 255, 44, 0.12);
      border: 1px solid rgba(184, 255, 44, 0.3);
      color: #B8FF2C;
      font-size: 12px;
      font-family: monospace;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    .icon-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(15, 56, 192, 0.2);
      border: 1px solid #283570;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #8898C8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: #8898C8;
      font-size: 14.5px;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }
    .btn-primary {
      background: #B8FF2C;
      color: #03050F;
    }
    .btn-primary:hover {
      background: #c7ff4d;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
      border: 1px solid #1E2756;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #283570;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #556699;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <span class="badge">OFFLINE MODE</span>
    <h1>Network Unavailable</h1>
    <p>
      You are currently browsing offline. Your previously saved event QR admission passes, offline directory cards, and cached content remain accessible on this device.
    </p>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.href='/dashboard'">
        View Saved Digital Passes & QR Codes
      </button>
      <button class="btn btn-secondary" onclick="window.location.reload()">
        Try Reconnecting
      </button>
    </div>

    <div class="footer-note">
      ASCEND CA PWA · Offline Secure Storage Active
    </div>
  </div>
</body>
</html>
