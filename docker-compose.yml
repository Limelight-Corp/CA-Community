version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ascend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ascend_ca}
    ports:
      # Host-only: nginx reaches this over the Docker network; never expose it publicly.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ascend_ca}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ascend_network

  redis:
    image: redis:7-alpine
    container_name: ascend-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      # Host-only: nginx reaches this over the Docker network; never expose it publicly.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redispassword}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ascend_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ascend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ascend_ca}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_access_secret_change_me_before_launching}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_refresh_secret_change_me_before_launching}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-prod_admin_secret_change_me_before_launching}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-01234567890123456789012345678901}
      ADMIN_API_ENABLED: 'true'
      ADMIN_ALLOWED_ORIGIN: ${ADMIN_ALLOWED_ORIGIN:-http://localhost:3001}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:3000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
    ports:
      # Host-only: nginx reaches this over the Docker network; never expose it publicly.
      - '127.0.0.1:4000:4000'
    networks:
      - ascend_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ascend-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
    ports:
      # Host-only: nginx reaches this over the Docker network; never expose it publicly.
      - '127.0.0.1:3000:3000'
    networks:
      - ascend_network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: ascend-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:4000/admin-api/v1
      NEXT_PUBLIC_ADMIN_APP_URL: http://localhost:3001
      ADMIN_GATE_USER: ${ADMIN_GATE_USER:?ADMIN_GATE_USER must be set}
      ADMIN_GATE_PASSWORD: ${ADMIN_GATE_PASSWORD:?ADMIN_GATE_PASSWORD must be set}
    ports:
      # Host-only: nginx reaches this over the Docker network; never expose it publicly.
      - '127.0.0.1:3001:3001'
    networks:
      - ascend_network

  nginx:
    image: nginx:1.25-alpine
    container_name: ascend-nginx
    restart: unless-stopped
    depends_on:
      - web
      - admin
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - ascend_network

volumes:
  postgres_data:
    name: ascend_postgres_data
  redis_data:
    name: ascend_redis_data

networks:
  ascend_network:
    name: ascend_network
    driver: bridge
