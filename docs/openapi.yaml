openapi: 3.0.0
info:
  title: ASCEND CA Community API
  version: 1.0.0
  description: Pan-India community platform REST API for Chartered Accountants,
    corporate leaders, and students.
servers:
  - url: http://localhost:4000
    description: Local Development Server
  - url: https://api.ascend-ca.in
    description: Production API
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Member access token (JWT)
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token (JWT) with verified 2FA claim
  schemas:
    LoginWithEmail:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    LoginWithOtp:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^[6-9]\d{9}$
      required:
        - mobile
    VerifyOtp:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^[6-9]\d{9}$
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - mobile
        - otp
    MemberRegister:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        mobile:
          type: string
          pattern: ^[6-9]\d{9}$
        city:
          type: string
          minLength: 2
        membershipNumber:
          type: string
        qualificationYear:
          type: integer
          minimum: 1950
          maximum: 2026
        firmName:
          type: string
        plan:
          type: string
          enum: &a4
            - Core
            - Associate
            - Student
          default: Core
        termsAccepted:
          type: boolean
          enum:
            - true
      required:
        - name
        - email
        - mobile
        - city
        - termsAccepted
    AdminLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        totpCode:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - email
        - password
    AdminSudoReauth:
      type: object
      properties:
        password:
          type: string
          minLength: 1
        totpCode:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - password
    CreateEvent:
      type: object
      properties:
        slug:
          type: string
          minLength: 2
          pattern: ^[a-z0-9-]+$
        title:
          type: string
          minLength: 3
        wingNumber:
          type: integer
          minimum: 1
          maximum: 10
        category:
          type: string
          enum: &a1
            - Conference
            - Workshop
            - Seminar
            - Networking
            - Training
            - Career
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        time:
          type: string
          minLength: 2
        venue:
          type: string
          minLength: 2
        city:
          type: string
          minLength: 2
        mode:
          type: string
          enum: &a2
            - Online
            - Offline
        fee:
          type: integer
          minimum: 0
        memberFee:
          type: integer
          minimum: 0
        seatsTotal:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        speakerSlugs:
          type: array
          items:
            type: string
          default: &a3 []
        description:
          type: string
          minLength: 10
        agenda:
          type: array
          items:
            type: object
            properties:
              offsetMinutes:
                type: integer
                minimum: 0
              title:
                type: string
                minLength: 1
              subtitle:
                type: string
            required:
              - offsetMinutes
              - title
      required:
        - slug
        - title
        - wingNumber
        - category
        - date
        - time
        - venue
        - city
        - mode
        - fee
        - memberFee
        - seatsTotal
        - description
    UpdateEvent:
      type: object
      properties:
        slug:
          type: string
          minLength: 2
          pattern: ^[a-z0-9-]+$
        title:
          type: string
          minLength: 3
        wingNumber:
          type: integer
          minimum: 1
          maximum: 10
        category:
          type: string
          enum: *a1
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        time:
          type: string
          minLength: 2
        venue:
          type: string
          minLength: 2
        city:
          type: string
          minLength: 2
        mode:
          type: string
          enum: *a2
        fee:
          type: integer
          minimum: 0
        memberFee:
          type: integer
          minimum: 0
        seatsTotal:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        speakerSlugs:
          type: array
          items:
            type: string
          default: *a3
        description:
          type: string
          minLength: 10
        agenda:
          type: array
          items:
            type: object
            properties:
              offsetMinutes:
                type: integer
                minimum: 0
              title:
                type: string
                minLength: 1
              subtitle:
                type: string
            required:
              - offsetMinutes
              - title
    EventFilter:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
        limit:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          default: 20
        q:
          type: string
        category:
          type: string
          enum: &a5
            - All
            - Conference
            - Workshop
            - Seminar
            - Networking
            - Training
            - Career
          default: All
        mode:
          type: string
          enum: &a6
            - ""
            - Online
            - Offline
        wing:
          type: integer
          minimum: 1
          maximum: 10
        city:
          type: string
    RegisterEvent:
      type: object
      properties:
        eventId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        mobile:
          type: string
          pattern: ^[6-9]\d{9}$
        membershipNumber:
          type: string
        city:
          type: string
          minLength: 2
        organization:
          type: string
        termsAccepted:
          type: boolean
          enum:
            - true
      required:
        - eventId
        - name
        - email
        - mobile
        - city
        - termsAccepted
    CreateOrder:
      type: object
      properties:
        itemType:
          type: string
          enum: &a7
            - EVENT_TICKET
            - MEMBERSHIP
        itemId:
          type: string
          minLength: 1
        gstin:
          type: string
          pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$
        billingAddress:
          type: object
          properties:
            line1:
              type: string
              minLength: 1
            line2:
              type: string
            city:
              type: string
              minLength: 1
            state:
              type: string
              minLength: 1
            pincode:
              type: string
              pattern: ^\d{6}$
          required:
            - line1
            - city
            - state
            - pincode
      required:
        - itemType
        - itemId
    VerifyPayment:
      type: object
      properties:
        razorpayOrderId:
          type: string
          minLength: 1
        razorpayPaymentId:
          type: string
          minLength: 1
        razorpaySignature:
          type: string
          minLength: 1
      required:
        - razorpayOrderId
        - razorpayPaymentId
        - razorpaySignature
    RefundPayment:
      type: object
      properties:
        paymentId:
          type: string
          minLength: 1
        amount:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        reason:
          type: string
          minLength: 3
      required:
        - paymentId
        - reason
    UpdateMemberProfile:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        city:
          type: string
          minLength: 2
        firmName:
          type: string
        specialization:
          type: string
        bio:
          type: string
          maxLength: 1000
        linkedInUrl:
          anyOf:
            - type: string
              format: uri
            - type: string
              enum:
                - ""
        wingPreferences:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 10
    MemberQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
        limit:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          default: 20
        search:
          type: string
        plan:
          type: string
          enum:
            - All
            - Core
            - Associate
            - Student
          default: All
        city:
          type: string
        status:
          type: string
          enum:
            - ALL
            - PENDING
            - ACTIVE
            - SUSPENDED
          default: ALL
    UpdateThemeSettings:
      type: object
      properties:
        platform:
          type: string
          enum: &a8
            - WEB
            - MOBILE
          default: WEB
        mode:
          type: string
          enum: &a9
            - DARK
            - LIGHT
          default: DARK
        tokens:
          type: object
          properties:
            bg:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            card:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            fg:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            muted:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            faint:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            line:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            soft:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            lime:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            limeInk:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            limeDeep:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            sky:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            cobalt:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            navy:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            mist:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            ok:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            okBg:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            warn:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            warnBg:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            bad:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            badBg:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            yellow:
              type: string
              pattern: ^(#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*[\d.]+\s*)?\))$
            radius:
              type: string
              pattern: ^\d+(px|rem)$
            fontSans:
              type: string
              minLength: 1
            fontDisplay:
              type: string
              minLength: 1
            fontSerif:
              type: string
              minLength: 1
            fontMono:
              type: string
              minLength: 1
          required:
            - bg
            - card
            - fg
            - muted
            - faint
            - line
            - soft
            - lime
            - limeInk
            - limeDeep
            - sky
            - cobalt
            - navy
            - mist
            - ok
            - okBg
            - warn
            - warnBg
            - bad
            - badBg
            - yellow
            - radius
            - fontSans
            - fontDisplay
            - fontSerif
            - fontMono
        fonts:
          type: object
          properties:
            sans:
              type: string
              enum: &a10
                - Inter
                - Roboto
                - Plus Jakarta Sans
                - Outfit
            display:
              type: string
              enum: &a11
                - Inter Tight
                - Outfit
                - Cabinet Grotesk
                - Cinzel
            serif:
              type: string
              enum: &a12
                - Instrument Serif
                - Playfair Display
                - Lora
                - Merriweather
            mono:
              type: string
              enum: &a13
                - Geist Mono
                - JetBrains Mono
                - Fira Code
                - Space Mono
          required:
            - sans
            - display
            - serif
            - mono
        logoUrl:
          anyOf:
            - type: string
              format: uri
            - type: string
              enum:
                - ""
        faviconUrl:
          anyOf:
            - type: string
              format: uri
            - type: string
              enum:
                - ""
        syncMobileWithWeb:
          type: boolean
          default: true
      required:
        - tokens
  parameters: {}
paths:
  /api/v1/auth/login-email:
    post:
      summary: Member login using email and password
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
                - email
                - password
      responses:
        "200":
          description: Authenticated successfully
        "401":
          description: Invalid credentials
  /api/v1/auth/send-otp:
    post:
      summary: Send mobile OTP for login/registration
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  pattern: ^[6-9]\d{9}$
              required:
                - mobile
      responses:
        "200":
          description: OTP dispatched via SMS/WhatsApp
  /api/v1/auth/verify-otp:
    post:
      summary: Verify mobile OTP and authenticate
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  pattern: ^[6-9]\d{9}$
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
              required:
                - mobile
                - otp
      responses:
        "200":
          description: OTP verified successfully
        "400":
          description: Invalid or expired OTP
  /api/v1/auth/register:
    post:
      summary: Register a new member
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                mobile:
                  type: string
                  pattern: ^[6-9]\d{9}$
                city:
                  type: string
                  minLength: 2
                membershipNumber:
                  type: string
                qualificationYear:
                  type: integer
                  minimum: 1950
                  maximum: 2026
                firmName:
                  type: string
                plan:
                  type: string
                  enum: *a4
                  default: Core
                termsAccepted:
                  type: boolean
                  enum:
                    - true
              required:
                - name
                - email
                - mobile
                - city
                - termsAccepted
      responses:
        "201":
          description: Member registered successfully
        "409":
          description: Email or mobile already registered
  /api/v1/events:
    get:
      summary: List events with filters
      tags:
        - Events
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
            enum: *a5
            default: All
          required: false
          name: category
          in: query
        - schema:
            type: string
            enum: *a6
          required: false
          name: mode
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 10
          required: false
          name: wing
          in: query
        - schema:
            type: string
          required: false
          name: city
          in: query
      responses:
        "200":
          description: List of events
  /api/v1/events/{idOrSlug}:
    get:
      summary: Get event details by ID or Slug
      tags:
        - Events
      responses:
        "200":
          description: Event details
        "404":
          description: Event not found
  /api/v1/events/register:
    post:
      summary: Register for an event
      tags:
        - Events
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                mobile:
                  type: string
                  pattern: ^[6-9]\d{9}$
                membershipNumber:
                  type: string
                city:
                  type: string
                  minLength: 2
                organization:
                  type: string
                termsAccepted:
                  type: boolean
                  enum:
                    - true
              required:
                - eventId
                - name
                - email
                - mobile
                - city
                - termsAccepted
      responses:
        "200":
          description: Registration confirmed or payment required
  /api/v1/payments/create-order:
    post:
      summary: Create Razorpay order (server-calculated price)
      tags:
        - Payments
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemType:
                  type: string
                  enum: *a7
                itemId:
                  type: string
                  minLength: 1
                gstin:
                  type: string
                  pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$
                billingAddress:
                  type: object
                  properties:
                    line1:
                      type: string
                      minLength: 1
                    line2:
                      type: string
                    city:
                      type: string
                      minLength: 1
                    state:
                      type: string
                      minLength: 1
                    pincode:
                      type: string
                      pattern: ^\d{6}$
                  required:
                    - line1
                    - city
                    - state
                    - pincode
              required:
                - itemType
                - itemId
      responses:
        "200":
          description: Order created with Razorpay order ID
  /api/v1/payments/verify:
    post:
      summary: Verify Razorpay payment signature
      tags:
        - Payments
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                razorpayOrderId:
                  type: string
                  minLength: 1
                razorpayPaymentId:
                  type: string
                  minLength: 1
                razorpaySignature:
                  type: string
                  minLength: 1
              required:
                - razorpayOrderId
                - razorpayPaymentId
                - razorpaySignature
      responses:
        "200":
          description: Payment verified and ticket/membership confirmed
        "400":
          description: Invalid HMAC signature
  /api/v1/theme:
    get:
      summary: Get active published design tokens & fonts
      tags:
        - Theme
      responses:
        "200":
          description: Active theme tokens
  /admin-api/v1/auth/login:
    post:
      summary: Admin login with 2FA verification
      tags:
        - Admin Auth
      requestBody:
        content:
          application/json:
            schema:
